[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "claude-github-assistant"
version = "2.0.0"
description = "Approval-first MCP server for Git and GitHub"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.12,<2", "httpx>=0.27,<1", "python-dotenv>=1.0,<2"]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.6"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
[tool.ruff]
line-length = 100
target-version = "py311"
